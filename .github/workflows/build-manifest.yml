name: Build works manifest

on:
  push:
    branches: [ main ]
    paths:
      - "assets/works/**"
      - ".github/workflows/build-manifest.yml"
      - "scripts/build-works-manifest.py"
      - "index.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate works.json
        run: |
          python scripts/build-works-manifest.py

      - name: Commit & push manifest if changed
        run: |
          if [[ -n "$(git status --porcelain assets/works/works.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/works/works.json
            git commit -m "chore: update works.json"
            git push
          else
            echo "No changes to commit."
          fi
